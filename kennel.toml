[package]
name = "presentations"
version = "0.2.0"
description = "Optional static presentation composition and viewer for Kujo SSG and SiteKit."
license = "MIT"
readme = "README.md"
repository = "https://github.com/kujolang/presentations"

[package.status]
stage = "preview"
stability = "experimental"
public_api = true

[kujo]
minimum_version = "1.5.0"
entry = "build.kujo"
sources = ["src"]
includes = ["CHANGELOG.md", "vendor", "patches", "assets", "layouts", "examples", "docs", "README.md", "dependencies.json", "starters", "scripts", "tests", "CREATE_A_DECK.md", "AGENTS.md", "deck.schema.json", "package.json", "package-lock.json", "playwright.config.js"]
excludes = [".git", ".build", "output", "node_modules", "test-results", ".deps", "decks"]

[scripts]
test = "npm test"

[package.exports]
render = "src/render.kujo"
