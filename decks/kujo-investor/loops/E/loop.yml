objective: "Verify navigation, presenter, print/read, evidence, finance controls, responsive viewports, axe and console."
max_iterations: 3
max_no_progress: 2
max_consecutive_failures: 2
allowed_actions:
  - read_files
  - edit_files
  - run_tests
blocked_actions:
  - deploy
  - destructive_cleanup
eval_gates:
  - id: evidence_and_review
    command: "python3 scripts/gate.py E"
    required: true
commit:
  enabled: false
  push: false
